server {
    listen 9996;
    listen 9997 ssl;
    server_name 127.0.0.1;

    ssl_certificate /etc/nginx/ssl/abution.crt;
    ssl_certificate_key /etc/nginx/ssl/abution.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ignore_invalid_headers off;
    
    # 基础认证
    auth_basic "AbutionGraph Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;
    error_page 401 /401.html;
    
    access_log /thutmose/logs/nginx/access.log debug_log;
    error_log /thutmose/logs/nginx/error.log debug;
    
    # 获取原始请求信息
    set $original_host $http_host;
    set $original_uri $request_uri;
    
    # 添加响应头
    add_header X-Debug-Host $original_host always;
    add_header X-Debug-URI $original_uri always;
    add_header X-Debug-Method $request_method always;
    
    # 从多个地方尝试获取 graph 名称
    set $graph_name "RAG";
    
    if ($args ~* "graph=([^&]+)") {
        set $graph_name $1;
    }
    
    if ($http_cookie ~* "graph=([^;]+)") {
        set $graph_name $1;
    }
    
    add_header X-Graph-From-Args $graph_name always;
    add_header X-Graph-From-Cookie $graph_name always;
    add_header X-Graph-Used $graph_name always;
    
    # 代理设置
    proxy_set_header Host $original_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $original_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Original-URI $original_uri;
    proxy_set_header X-Graph-Name $graph_name;
    
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    
    proxy_redirect http://127.0.0.1:9995/ http://$original_host/;
    proxy_redirect http://127.0.0.1:9995 http://$original_host;
    proxy_redirect / /;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    error_page 500 = @log_error;
    location @log_error {
        access_log /thutmose/logs/nginx/error_details.log debug_log;
        return 500;
    }
    
    location /rest/graph/operations/execute {
        client_body_buffer_size 1000m;
        client_max_body_size 100m;
        access_log /thutmose/logs/nginx/execute.log debug_log;
        access_log /thutmose/logs/nginx/error_requests.log debug_log if=$status~^5;
        add_header X-Endpoint "operations/execute" always;
        
	# 明确转发认证头和 graph ID
	proxy_set_header Authorization $http_authorization;
	proxy_set_header abution.graphId $http_abution_graphid;
	proxy_set_header abution-graph-id $http_abution_graphid;

	# 添加调试头
	add_header X-Proxied-Graph $http_abution_graphid;

	# 禁用缓冲防止连接重置
	proxy_request_buffering off;
	proxy_buffering off;

        set $args_with_graph $args;
        if ($args !~ "graph=") {
            set $args_with_graph graph=$graph_name&$args;
            add_header X-Added-Graph "true" always;
        }
        
        add_header X-Forwarded-URI "/rest/graph/operations/execute?$args_with_graph" always;
        proxy_pass http://127.0.0.1:9995/rest/graph/operations/execute?$args_with_graph;
    }
    
    location /rest/ {
        proxy_pass http://127.0.0.1:9995/rest/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 更宽容的 CORS 设置
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, abution.graphId, abution-graph-id" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age "3600" always;
        
        # 处理 OPTIONS 预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, abution.graphId, abution-graph-id";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age "3600";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
    
    location /db/ {
        access_log /thutmose/logs/nginx/db.log debug_log;
        add_header X-Endpoint "db" always;
        proxy_pass http://127.0.0.1:9995/db/;
    }
    
    location / {
        access_log /thutmose/logs/nginx/web.log debug_log;
        add_header X-Endpoint "web" always;
        proxy_pass http://127.0.0.1:9995/;
        
        sub_filter_once off;
        sub_filter_types *;
        sub_filter "127.0.0.1:9995" "$original_host";
        sub_filter "127.0.0.1:9996" "$original_host";
    }
    
    location /graph {
        access_log /thutmose/logs/nginx/graph.log debug_log;
        add_header X-Endpoint "graph" always;
        proxy_pass http://127.0.0.1:9995/graph;
    }
    
    location /graph/ {
        access_log /thutmose/logs/nginx/graph.log debug_log;
        add_header X-Endpoint "graph/" always;
        proxy_pass http://127.0.0.1:9995/graph/;
    }
}