<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">个性化学习闭环总图</title>
  <desc id="desc">围绕学生画像、学习路径、资源生成与智能学伴的总体闭环图</desc>
  <defs>
    <linearGradient id="sideBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf5ff" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#eaf5ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#eaf5ff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sideRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2ef" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#fff2ef" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff2ef" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="leftHalo" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#dcefff" stop-opacity="0.95"/>
      <stop offset="0.68" stop-color="#edf7ff" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightHalo" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#ffe6df" stop-opacity="0.95"/>
      <stop offset="0.68" stop-color="#fff1ed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerHalo" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.58" stop-color="#f3eef8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueBlock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb1dc"/>
      <stop offset="0.48" stop-color="#5b96ca"/>
      <stop offset="1" stop-color="#386f9f"/>
    </linearGradient>
    <linearGradient id="purpleBlock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a996d4"/>
      <stop offset="1" stop-color="#654aa4"/>
    </linearGradient>
    <linearGradient id="rosePill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e6e2"/>
      <stop offset="1" stop-color="#d9958b"/>
    </linearGradient>
    <linearGradient id="pillFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#8b93a3"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#477da9"/>
    </marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L9,4 z" fill="#7e65b5"/>
    </marker>
    <filter id="drop" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#203040" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #1f2937; }
      .sub { font-size: 17px; fill: #667085; }
      .sideBlueText { font-size: 30px; font-weight: 800; fill: #356b93; }
      .sideRoseText { font-size: 30px; font-weight: 800; fill: #a95751; }
      .pillText { font-size: 20px; font-weight: 700; fill: #263445; }
      .smallText { font-size: 17px; font-weight: 700; fill: #344054; }
      .barText { font-size: 25px; font-weight: 800; fill: #ffffff; }
      .centerText { font-size: 30px; font-weight: 800; fill: #9b5d55; }
      .lineLabel { font-size: 16px; font-weight: 700; fill: #707987; }
      .pill { fill: url(#pillFill); stroke: #aeb7c2; stroke-width: 1.5; }
      .blueBlock { fill: url(#blueBlock); stroke: #386f9f; stroke-width: 1.4; filter: url(#drop); }
      .purpleBlock { fill: url(#purpleBlock); stroke: #654aa4; stroke-width: 1.4; filter: url(#drop); }
      .rosePill { fill: url(#rosePill); stroke: #cd8c84; stroke-width: 1.1; filter: url(#drop); }
      .dash { fill: none; stroke: #9aa2ad; stroke-width: 1.7; stroke-dasharray: 7 7; }
      .dashArrow { fill: none; stroke: #8b93a3; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrowGray); }
      .solidArrow { fill: none; stroke: #6d839d; stroke-width: 2.3; marker-end: url(#arrowGray); }
      .blueArrow { fill: none; stroke: #477da9; stroke-width: 2.8; marker-end: url(#arrowBlue); }
      .purpleArrow { fill: none; stroke: #7e65b5; stroke-width: 4; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text class="font title" x="800" y="38" text-anchor="middle">个性化学习闭环总图</text>
  <text class="font sub" x="800" y="68" text-anchor="middle">以学习状态表征为起点，经路径规划与资源生成形成智能学伴持续演化闭环</text>

  <rect x="36" y="136" width="78" height="640" fill="url(#sideBlue)"/>
  <text class="font sideBlueText" text-anchor="middle">
    <tspan x="75" y="258">学</tspan>
    <tspan x="75" y="293">习</tspan>
    <tspan x="75" y="328">状</tspan>
    <tspan x="75" y="363">态</tspan>
    <tspan x="75" y="398">的</tspan>
    <tspan x="75" y="433">多</tspan>
    <tspan x="75" y="468">模</tspan>
    <tspan x="75" y="503">态</tspan>
    <tspan x="75" y="538">表</tspan>
    <tspan x="75" y="573">征</tspan>
  </text>
  <rect x="1486" y="136" width="78" height="640" fill="url(#sideRose)"/>
  <text class="font sideRoseText" text-anchor="middle">
    <tspan x="1525" y="258">智</tspan>
    <tspan x="1525" y="293">能</tspan>
    <tspan x="1525" y="328">学</tspan>
    <tspan x="1525" y="363">伴</tspan>
    <tspan x="1525" y="398">的</tspan>
    <tspan x="1525" y="433">自</tspan>
    <tspan x="1525" y="468">演</tspan>
    <tspan x="1525" y="503">化</tspan>
    <tspan x="1525" y="538">闭</tspan>
    <tspan x="1525" y="573">环</tspan>
  </text>

