    <rect class="pill" x="1300" y="206" width="164" height="38" rx="19"/>
    <text class="pillText" x="1382" y="232" text-anchor="middle">主动关怀</text>
    <rect class="pill" x="1288" y="270" width="164" height="38" rx="19"/>
    <text class="pillText" x="1370" y="296" text-anchor="middle">记忆沉淀</text>
    <rect class="pill" x="1288" y="650" width="164" height="38" rx="19"/>
    <text class="pillText" x="1370" y="676" text-anchor="middle">资源列表</text>
    <rect class="pill" x="1300" y="714" width="164" height="38" rx="19"/>
    <text class="pillText" x="1382" y="740" text-anchor="middle">学生成长树</text>
    <path class="dash" d="M1452 161 H1486"/>
    <path class="dash" d="M1464 225 H1486"/>
    <path class="dash" d="M1452 289 H1486"/>
    <path class="dash" d="M1452 669 H1486"/>
    <path class="dash" d="M1464 733 H1486"/>
  </g>

  <ellipse cx="350" cy="452" rx="170" ry="198" fill="url(#leftHalo)"/>
  <ellipse cx="1250" cy="452" rx="170" ry="198" fill="url(#rightHalo)"/>
