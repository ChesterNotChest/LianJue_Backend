<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif">
  <defs>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <filter id="cardSh"><feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06"/></filter>
  </defs>

  <rect width="1440" height="900" fill="#f8fafc"/>

  <!-- Subtle decorative top bar accent -->
  <rect x="0" y="0" width="1440" height="4" fill="url(#topBar)"/>

  <!-- Brand area -->
  <g transform="translate(720,160)" text-anchor="middle">
    <text x="0" y="0" font-size="32" font-weight="800" fill="#0f172a" letter-spacing="2">联觉 LianJue</text>
    <text x="0" y="24" font-size="14" fill="#64748b">AI 驱动的自适应学习平台</text>
  </g>

  <!-- Login card -->
  <g transform="translate(520,230)">
    <rect x="0" y="0" width="400" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardSh)"/>

    <!-- Title -->
    <text x="200" y="40" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">登录</text>

    <!-- Username -->
    <g transform="translate(32,64)">
      <rect x="0" y="0" width="336" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="16" y="29" font-size="13" fill="#94a3b8">用户名</text>
    </g>

    <!-- Password -->
    <g transform="translate(32,122)">
      <rect x="0" y="0" width="336" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="16" y="29" font-size="13" fill="#94a3b8">密码</text>
    </g>

    <!-- Login button -->
    <g transform="translate(32,186)">
      <rect x="0" y="0" width="336" height="46" rx="10" fill="#6366f1"/>
      <text x="168" y="29" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">登 录</text>
    </g>
  </g>

  <!-- Quick-fill demo users -->
  <g transform="translate(520,520)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#94a3b8">Quick fill · password: demo123</text>
    <g transform="translate(0,16)">
      <rect x="0" y="0" width="120" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="60" y="22" font-size="11" fill="#475569" text-anchor="middle">demo_low_abc</text>
      <rect x="130" y="0" width="140" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="200" y="22" font-size="11" fill="#475569" text-anchor="middle">demo_medium_def</text>
      <rect x="280" y="0" width="120" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="340" y="22" font-size="11" fill="#475569" text-anchor="middle">demo_high_ghi</text>
    </g>
  </g>

  <!-- Seeded -->
  <g transform="translate(520,600)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#94a3b8">Latest seeded</text>
    <g transform="translate(0,16)">
      <rect x="0" y="0" width="160" height="50" rx="8" fill="#dcfce7" stroke="#bbf7d0"/>
      <text x="14" y="24" font-size="12" font-weight="600" fill="#16a34a">demo_low_alpha</text>
      <text x="14" y="40" font-size="10" fill="#65a30d">Low · Syllabus 8</text>

      <rect x="174" y="0" width="160" height="50" rx="8" fill="#dcfce7" stroke="#bbf7d0"/>
      <text x="188" y="24" font-size="12" font-weight="600" fill="#16a34a">demo_med_beta</text>
      <text x="188" y="40" font-size="10" fill="#65a30d">Medium · Syllabus 8</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="720" y="830" font-size="10" fill="#cbd5e1" text-anchor="middle">Seed demo students via pytest · refresh to see them here</text>
</svg>
