          <rect x="0" y="6" width="344" height="44" rx="6" fill="#fef2f2"/>
          <text x="12" y="22" font-size="10" fill="#ef4444">Combiner 机制</text>
          <text x="140" y="22" font-size="10" fill="#f59e0b">Partitioner</text>
          <text x="12" y="40" font-size="9" fill="#94a3b8">建议配合思维导图复习执行流程</text>
        </g>
      </g>

      <g transform="translate(700,16)">
        <text x="0" y="0" font-size="10" font-weight="600" fill="#64748b">提交历史</text>
        <g transform="translate(0,14)"><rect x="0" y="0" width="160" height="28" rx="6" fill="#fef3c7"/><circle cx="10" cy="14" r="4" fill="#f59e0b"/><text x="20" y="18" font-size="10" fill="#0f172a">第 2 次 · 70%</text><text x="130" y="18" font-size="9" fill="#94a3b8" text-anchor="end">10/08</text></g>
        <g transform="translate(0,46)"><rect x="0" y="0" width="160" height="28" rx="6" fill="#fef2f2"/><circle cx="10" cy="14" r="4" fill="#ef4444"/><text x="20" y="18" font-size="10" fill="#0f172a">第 1 次 · 50%</text><text x="130" y="18" font-size="9" fill="#94a3b8" text-anchor="end">10/05</text></g>
      </g>
    </g>

    <!-- ═══════ Quiz Card 3: Spark (untouched) ═══════ -->
    <g transform="translate(0,544)">
      <rect x="0" y="0" width="880" height="120" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-dasharray="5,3"/>

      <g transform="translate(20,16)">
        <rect x="0" y="0" width="280" height="88" rx="8" fill="#f1f5f9"/>
        <text x="16" y="24" font-size="10" font-weight="600" fill="#94a3b8">测验</text>
        <text x="16" y="44" font-size="16" font-weight="700" fill="#94a3b8">Spark RDD 核心概念</text>
        <text x="16" y="64" font-size="11" fill="#cbd5e1">10 题 · 尚未作答</text>
        <rect x="16" y="76" width="100" height="28" rx="8" fill="#6366f1"/>
        <text x="66" y="95" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">开始测验</text>
      </g>

      <g transform="translate(340,16)">
        <rect x="0" y="0" width="520" height="88" rx="8" fill="#f8fafc"/>
        <text x="260" y="40" font-size="12" fill="#94a3b8" text-anchor="middle">完成 MapReduce 测验后推荐尝试</text>
        <text x="260" y="56" font-size="11" fill="#cbd5e1" text-anchor="middle">建议先掌握 Shuffle 与 Combiner 概念</text>
      </g>
    </g>
  </g>

  <!-- Buddy FAB -->
  <g transform="translate(1364,870)">
    <circle cx="0" cy="0" r="30" fill="#fff" filter="url(#ss)"/><circle cx="0" cy="0" r="28" fill="#6366f1"/>
    <circle cx="-6" cy="-3" r="3.5" fill="#fff" opacity="0.9"/><circle cx="6" cy="-3" r="3.5" fill="#fff" opacity="0.9"/>
    <path d="M-8,8 Q0,18 8,8" stroke="#fff" fill="none" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <circle cx="20" cy="-20" r="10" fill="#ef4444"/><text x="20" y="-16" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  </g>
  <g transform="translate(1288,854)"><text x="0" y="0" font-size="11" fill="#6366f1" text-anchor="end">学伴小觉</text><text x="0" y="15" font-size="10" fill="#94a3b8" text-anchor="end">全天候陪伴</text></g>
</svg>
