        <text x="16" y="24" font-size="10" font-weight="600" fill="#f59e0b">测验</text>
        <text x="16" y="44" font-size="16" font-weight="700" fill="#0f172a">MapReduce 执行流程</text>
        <text x="16" y="64" font-size="11" fill="#64748b">10 题 · Shuffle、Combiner</text>
        <text x="16" y="82" font-size="11" fill="#64748b">Partitioner、优化策略</text>
        <rect x="16" y="100" width="100" height="28" rx="8" fill="#f59e0b"/>
        <text x="66" y="119" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">重新测验</text>
        <rect x="124" y="100" width="72" height="28" rx="8" fill="#fff" stroke="#e2e8f0"/>
        <text x="160" y="119" font-size="10" fill="#64748b" text-anchor="middle">查看详情</text>
