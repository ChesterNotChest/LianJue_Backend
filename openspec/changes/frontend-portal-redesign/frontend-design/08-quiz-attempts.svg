<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" font-family="Inter, system-ui, sans-serif">
  <defs><filter id="ss"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter></defs>
  <rect width="1440" height="960" fill="#f8fafc"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1440" height="56" fill="#fff" stroke="#f1f5f9"/>
  <text x="32" y="36" font-size="16" font-weight="800" fill="#6366f1" letter-spacing="1">联觉 LianJue</text>
  <text x="148" y="36" font-size="13" fill="#cbd5e1">/</text><text x="162" y="36" font-size="13" font-weight="600" fill="#0f172a">大数据概论</text>
  <text x="260" y="36" font-size="13" fill="#cbd5e1">/</text><text x="274" y="36" font-size="13" font-weight="600" fill="#6366f1">我的测验</text>
  <text x="360" y="36" font-size="11" fill="#6366f1">← 返回学科首页</text>

  <!-- Sidebar -->
