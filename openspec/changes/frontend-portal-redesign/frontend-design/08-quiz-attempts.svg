    <!-- ═══════ Quiz Card 2: MapReduce ═══════ -->
    <g transform="translate(0,328)">
      <rect x="0" y="0" width="880" height="200" rx="12" fill="#fff" stroke="#e2e8f0" filter="url(#ss)"/>

      <g transform="translate(20,16)">
