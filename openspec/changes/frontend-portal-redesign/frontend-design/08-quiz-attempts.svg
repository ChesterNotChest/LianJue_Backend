          <text x="16" y="18" font-size="9" fill="#64748b" font-weight="600">最近</text>
          <text x="16" y="36" font-size="18" font-weight="800" fill="#0f172a">70%</text>
          <text x="80" y="18" font-size="9" fill="#64748b">2 次提交</text>
          <text x="80" y="36" font-size="9" fill="#94a3b8">10/08 最后</text>
        </g>
        <g transform="translate(0,76)">
