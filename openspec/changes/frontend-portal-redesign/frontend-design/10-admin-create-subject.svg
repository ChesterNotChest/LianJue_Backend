<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif">
  <defs>
    <filter id="ms"><feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.18"/></filter>
  </defs>

  <!-- Dashboard background (dimmed) -->
  <rect width="1440" height="960" fill="#f8fafc"/>
  <rect x="0" y="0" width="1440" height="64" fill="#fff" stroke="#f1f5f9"/>
  <text x="32" y="40" font-size="16" font-weight="800" fill="#6366f1" letter-spacing="1">联觉 LianJue</text>
  <text x="80" y="118" font-size="28" font-weight="800" fill="#0f172a">我的学习</text>
  <g opacity="0.12">
    <rect x="80" y="172" width="384" height="266" rx="14" fill="#4f46e5"/><text x="272" y="280" font-size="28" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">大数据概论</text>
    <rect x="496" y="172" width="384" height="266" rx="14" fill="#0f766e"/><text x="688" y="280" font-size="28" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">Python</text>
  </g>

  <!-- Modal backdrop -->
  <rect x="0" y="0" width="1440" height="960" fill="#0f172a" opacity="0.4"/>

  <!-- ═══════ MODAL: Single-card wizard, 4-step ═══════ -->
  <g transform="translate(360,20)">
    <rect x="0" y="0" width="720" height="918" rx="18" fill="#fff" filter="url(#ms)"/>

    <!-- Header + step indicator -->
    <rect x="0" y="0" width="720" height="56" rx="18" fill="#fafafa"/><rect x="0" y="28" width="720" height="28" fill="#fafafa"/>
    <text x="32" y="35" font-size="16" font-weight="700" fill="#0f172a">创建新学科</text>
    <text x="700" y="35" font-size="20" fill="#94a3b8" text-anchor="end">✕</text>

    <!-- Step dots: 4 steps -->
    <g transform="translate(140,24)">
      <circle cx="0" cy="4" r="5" fill="#6366f1"/><text x="0" y="17" font-size="8" fill="#6366f1" text-anchor="middle">基本信息</text>
      <line x1="10" y1="4" x2="110" y2="4" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="120" cy="4" r="5" fill="#e2e8f0"/><text x="120" y="17" font-size="8" fill="#94a3b8" text-anchor="middle">上传日历</text>
      <line x1="130" y1="4" x2="230" y2="4" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="240" cy="4" r="5" fill="#e2e8f0"/><text x="240" y="17" font-size="8" fill="#94a3b8" text-anchor="middle">选择图谱</text>
      <line x1="250" y1="4" x2="350" y2="4" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="360" cy="4" r="5" fill="#e2e8f0"/><text x="360" y="17" font-size="8" fill="#94a3b8" text-anchor="middle">确认创建</text>
    </g>

    <!-- ═══ Section ①: 基本信息 ═══ -->
    <g transform="translate(40,72)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#6366f1">① 基本信息</text>

      <!-- 学科名称 -->
      <text x="0" y="24" font-size="11" font-weight="600" fill="#0f172a">学科名称</text>
      <rect x="0" y="30" width="640" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/>
      <text x="14" y="53" font-size="13" fill="#94a3b8">输入学科名称，如"算法设计与分析"</text>

      <!-- 学科描述 -->
      <text x="0" y="88" font-size="11" font-weight="600" fill="#0f172a">学科描述 <tspan font-size="10" font-weight="400" fill="#94a3b8">（可选）</tspan></text>
      <rect x="0" y="94" width="640" height="48" rx="8" fill="#fff" stroke="#e2e8f0"/>
      <text x="14" y="115" font-size="12" fill="#94a3b8">简要描述学科内容、目标学生群体或教学目标</text>

      <!-- 教学周数 + 学习目标 同行 -->
      <g transform="translate(0,156)">
        <text x="0" y="0" font-size="11" font-weight="600" fill="#0f172a">教学周数</text>
        <g transform="translate(0,8)">
          <rect x="0" y="0" width="56" height="28" rx="7" fill="#ede9fe" stroke="#6366f1" stroke-width="1.5"/>
          <text x="28" y="19" font-size="14" font-weight="800" fill="#6366f1" text-anchor="middle">8</text>
          <rect x="64" y="0" width="56" height="28" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="92" y="19" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">12</text>
          <rect x="128" y="0" width="56" height="28" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="156" y="19" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">16</text>
          <rect x="192" y="0" width="56" height="28" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="220" y="19" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">18</text>
          <text x="266" y="19" font-size="11" fill="#94a3b8">或</text>
          <rect x="288" y="0" width="60" height="28" rx="7" fill="#fff" stroke="#e2e8f0"/>
          <text x="318" y="19" font-size="10" fill="#94a3b8" text-anchor="middle">自定义</text>
        </g>
      </g>

      <!-- 学习目标 -->
      <g transform="translate(0,204)">
        <text x="0" y="0" font-size="11" font-weight="600" fill="#0f172a">学习目标</text>
        <g transform="translate(0,8)">
          <rect x="0" y="0" width="200" height="28" rx="7" fill="#ede9fe" stroke="#6366f1" stroke-width="1.5"/>
          <text x="100" y="13" font-size="10" font-weight="600" fill="#6366f1" text-anchor="middle">系统掌握 · 循序渐进</text>
          <text x="100" y="25" font-size="7" fill="#6366f1" text-anchor="middle">推荐 · 适合大多数课程</text>
          <rect x="212" y="0" width="200" height="28" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="312" y="13" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">应试准备 · 重点突破</text>
          <text x="312" y="25" font-size="7" fill="#94a3b8" text-anchor="middle">考试/面试导向</text>
          <rect x="424" y="0" width="200" height="28" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="524" y="13" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">项目实战 · 快速上手</text>
          <text x="524" y="25" font-size="7" fill="#94a3b8" text-anchor="middle">动手实践为主</text>
        </g>
      </g>
    </g>

    <!-- ═══ Section ②: 上传教学日历 (NEW) ═══ -->
    <g transform="translate(40,308)">
      <line x1="0" y1="0" x2="640" y2="0" stroke="#f1f5f9"/>
      <text x="0" y="24" font-size="13" font-weight="700" fill="#6366f1">② 上传教学日历</text>
      <text x="144" y="24" font-size="10" fill="#94a3b8">POST /api/file_upload_calendar — 必须步骤，提供 build_draft 所需的 file_id</text>

      <!-- File drop zone -->
      <g transform="translate(0,38)">
        <rect x="0" y="0" width="640" height="80" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-dasharray="6,3"/>
        <!-- Upload icon -->
        <g transform="translate(298,14)">
          <rect x="0" y="0" width="44" height="28" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
          <text x="22" y="19" font-size="10" fill="#6366f1" text-anchor="middle">PDF</text>
        </g>
        <text x="320" y="42" font-size="12" font-weight="600" fill="#6366f1" text-anchor="middle">上传教学日历 PDF</text>
        <text x="320" y="58" font-size="10" fill="#94a3b8" text-anchor="middle">拖拽文件到此处或点击选择 · 支持 .pdf 格式</text>
        <text x="320" y="74" font-size="8" fill="#94a3b8" text-anchor="middle">上传后自动创建 Syllabus 记录并返回 file_id + syllabus_id</text>
      </g>

      <!-- Uploaded file preview (once uploaded) — shown dimmed as hint -->
      <g transform="translate(0,126)" opacity="0.3">
        <rect x="0" y="0" width="640" height="28" rx="7" fill="#dcfce7" stroke="#bbf7d0"/>
        <text x="16" y="19" font-size="11" font-weight="600" fill="#166534">✓ 算法设计与分析_教学日历.pdf</text>
        <text x="500" y="19" font-size="9" fill="#64748b">syllabus_id: 42</text>
      </g>
    </g>

    <!-- ═══ Section ③: 选择或创建图谱 ═══ -->
    <g transform="translate(40,462)">
      <line x1="0" y1="0" x2="640" y2="0" stroke="#f1f5f9"/>
      <text x="0" y="24" font-size="13" font-weight="700" fill="#6366f1">③ 选择或创建知识图谱</text>
      <text x="182" y="24" font-size="10" fill="#94a3b8">GET /api/graph/list · POST /api/job_graph_create</text>

      <!-- Collapsed selector bar (inactive state) — dimmed -->
      <g transform="translate(0,38)" opacity="0.25">
        <rect x="0" y="0" width="640" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/>
        <circle cx="20" cy="18" r="7" fill="#6366f1" opacity="0.12"/>
        <text x="34" y="22" font-size="11" fill="#0f172a">Algorithm (8,200 nodes)</text>
        <text x="580" y="22" font-size="10" fill="#6366f1" text-anchor="end">展开 ▾</text>
      </g>

      <!-- Expanded graph selector -->
      <g transform="translate(0,36)">
        <rect x="0" y="0" width="640" height="36" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.5"/>
        <circle cx="20" cy="18" r="7" fill="#6366f1" opacity="0.12"/>
        <text x="34" y="22" font-size="11" font-weight="600" fill="#0f172a">Algorithm (8,200 nodes)</text>
        <text x="580" y="22" font-size="10" fill="#6366f1" text-anchor="end">收起 ▴</text>

        <g transform="translate(0,48)">
          <rect x="-4" y="-4" width="648" height="82" rx="10" fill="#fafafa" stroke="#f1f5f9"/>

          <g transform="translate(4,4)">
            <rect x="0" y="0" width="204" height="64" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="1.5"/>
            <circle cx="24" cy="32" r="14" fill="#6366f1" opacity="0.12" stroke="#6366f1" stroke-width="1.5"/>
            <text x="24" y="36" font-size="8" font-weight="700" fill="#6366f1" text-anchor="middle">Alg</text>
            <text x="46" y="26" font-size="12" font-weight="700" fill="#0f172a">Algorithm</text>
            <text x="46" y="42" font-size="9" fill="#64748b">8,200 nodes</text>
            <text x="46" y="54" font-size="8" fill="#6366f1">已选择</text>
          </g>

          <g transform="translate(218,4)">
            <rect x="0" y="0" width="204" height="64" rx="10" fill="#fff" stroke="#e2e8f0"/>
            <circle cx="24" cy="32" r="14" fill="#a78bfa" opacity="0.12" stroke="#a78bfa" stroke-width="1.5"/>
            <text x="24" y="36" font-size="8" font-weight="700" fill="#a78bfa" text-anchor="middle">RAG</text>
            <text x="46" y="26" font-size="12" font-weight="700" fill="#0f172a">RAG</text>
            <text x="46" y="42" font-size="9" fill="#64748b">12,480 nodes</text>
            <text x="46" y="54" font-size="8" fill="#94a3b8">点击选择</text>
          </g>

          <g transform="translate(432,4)">
            <rect x="0" y="0" width="204" height="64" rx="10" fill="#fff" stroke="#e2e8f0"/>
            <circle cx="24" cy="32" r="14" fill="#22c55e" opacity="0.12" stroke="#22c55e" stroke-width="1.5"/>
            <text x="24" y="36" font-size="8" font-weight="700" fill="#22c55e" text-anchor="middle">SW</text>
            <text x="46" y="26" font-size="12" font-weight="700" fill="#0f172a">Software</text>
            <text x="46" y="42" font-size="9" fill="#64748b">5,600 nodes</text>
            <text x="46" y="54" font-size="8" fill="#94a3b8">点击选择</text>
          </g>
        </g>
      </g>

      <!-- Divider + Create new -->
      <g transform="translate(0,166)">
        <line x1="0" y1="0" x2="280" y2="0" stroke="#f1f5f9"/>
        <text x="300" y="5" font-size="10" fill="#cbd5e1" text-anchor="middle">或自行创建</text>
        <line x1="380" y1="0" x2="640" y2="0" stroke="#f1f5f9"/>

        <g transform="translate(0,16)">
          <rect x="0" y="0" width="640" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/>
          <text x="16" y="25" font-size="12" fill="#94a3b8">输入新图谱名称，如"数据结构"</text>
          <rect x="560" y="6" width="68" height="28" rx="7" fill="#6366f1"/>
          <text x="594" y="25" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">创建图谱</text>
        </g>
        <text x="0" y="72" font-size="9" fill="#94a3b8">初始化空图谱后，可在管理页上传文件填充知识节点</text>
      </g>
    </g>

    <!-- ═══ Section ④: 确认创建 ═══ -->
    <g transform="translate(40,696)">
      <line x1="0" y1="0" x2="640" y2="0" stroke="#f1f5f9"/>
      <text x="0" y="24" font-size="13" font-weight="700" fill="#6366f1">④ 确认创建</text>

      <!-- Summary preview -->
      <g transform="translate(0,40)">
        <rect x="0" y="0" width="640" height="118" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
        <g transform="translate(24,20)">
          <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">算法设计与分析</text>
          <rect x="150" y="-6" width="36" height="14" rx="4" fill="#ede9fe"/><text x="168" y="4" font-size="7" fill="#6366f1" text-anchor="middle">16周</text>
          <rect x="192" y="-6" width="52" height="14" rx="4" fill="#ede9fe"/><text x="218" y="4" font-size="7" fill="#6366f1" text-anchor="middle">Algorithm</text>
          <rect x="250" y="-6" width="48" height="14" rx="4" fill="#ede9fe"/><text x="274" y="4" font-size="7" fill="#6366f1" text-anchor="middle">系统掌握</text>
          <rect x="304" y="-6" width="80" height="14" rx="4" fill="#dcfce7"/><text x="344" y="4" font-size="7" fill="#166534">教学日历已上传</text>

          <!-- What happens after creation -->
          <g transform="translate(0,30)">
            <circle cx="5" cy="5" r="3" fill="#dcfce7"/><text x="14" y="9" font-size="10" fill="#0f172a">POST /api/file_upload_calendar → POST /api/syllabus_build_draft</text>
            <circle cx="5" cy="21" r="3" fill="#ede9fe"/><text x="14" y="25" font-size="10" fill="#0f172a">build_draft 读取教学日历 → pdf_to_md 管道 → LLM 生成周次大纲草稿</text>
            <circle cx="5" cy="37" r="3" fill="#fef3c7"/><text x="14" y="41" font-size="10" fill="#0f172a">草稿不立即发布，可在管理页逐周编辑后发布</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Bottom actions -->
    <g transform="translate(0,836)">
      <line x1="40" y1="0" x2="680" y2="0" stroke="#f1f5f9"/>
      <rect x="422" y="16" width="80" height="40" rx="10" fill="#f1f5f9"/>
      <text x="462" y="42" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">取消</text>
      <rect x="514" y="16" width="166" height="40" rx="10" fill="#6366f1"/>
      <text x="597" y="42" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">创建学科</text>
    </g>

    <!-- Backend requirement note -->
    <g transform="translate(40,888)">
      <rect x="0" y="0" width="640" height="16" rx="4" fill="#fef3c7"/>
      <text x="320" y="12" font-size="8" fill="#d97706" text-anchor="middle">确认后依次调用: ① POST /api/file_upload_calendar {file_name, file_bytes, title} → syllabus_id ② POST /api/syllabus_build_draft {syllabus_id, graph_id, initial_prompt} → 生成大纲草稿</text>
    </g>
  </g>
</svg>
