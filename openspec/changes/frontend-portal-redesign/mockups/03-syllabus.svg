      <g transform="translate(68,80)"><rect x="0" y="0" width="740" height="58" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#ss)"/><rect x="0" y="0" width="4" height="58" rx="2" fill="#22c55e"/>
      <text x="16" y="20" font-size="13" font-weight="700" fill="#0f172a">第 2 周 · MapReduce 编程模型</text><text x="16" y="36" font-size="11" fill="#64748b">Map/Shuffle/Reduce 三阶段、Combiner、Partitioner、优化策略</text><text x="680" y="36" font-size="10" fill="#22c55e" text-anchor="end">已掌握</text></g>

