      <circle cx="40" cy="360" r="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <g transform="translate(68,348)"><rect x="0" y="0" width="740" height="58" rx="8" fill="#fafafa" stroke="#f1f5f9" filter="url(#ss)"/>
      <text x="16" y="20" font-size="13" font-weight="600" fill="#94a3b8">第 5 周 · Spark SQL 与 DataFrame</text><text x="16" y="36" font-size="11" fill="#cbd5e1">DataFrame API、Spark SQL 查询优化、Catalyst 优化器</text><text x="680" y="36" font-size="10" fill="#94a3b8" text-anchor="end">待开始</text></g>

      <circle cx="40" cy="440" r="5" fill="#e2e8f0"/><circle cx="40" cy="460" r="5" fill="#e2e8f0"/><circle cx="40" cy="480" r="5" fill="#e2e8f0"/>

      <circle cx="40" cy="560" r="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
      <g transform="translate(68,548)"><rect x="0" y="0" width="740" height="58" rx="8" fill="#fafafa" stroke="#f1f5f9" filter="url(#ss)"/>
      <text x="16" y="20" font-size="13" font-weight="600" fill="#94a3b8">第 18 周 · 课程总结与项目答辩</text><text x="16" y="36" font-size="11" fill="#cbd5e1">综合项目展示、知识体系回顾、扩展学习建议</text><text x="680" y="36" font-size="10" fill="#94a3b8" text-anchor="end">待开始</text></g>
