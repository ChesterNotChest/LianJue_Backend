      <g transform="translate(68,-10)"><rect x="0" y="0" width="740" height="58" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#ss)"/><rect x="0" y="0" width="4" height="58" rx="2" fill="#22c55e"/>
      <text x="16" y="20" font-size="13" font-weight="700" fill="#0f172a">第 1 周 · HDFS 基础架构</text><text x="16" y="36" font-size="11" fill="#64748b">分布式文件系统概念、NameNode/DataNode 角色、数据块与副本机制</text><text x="680" y="36" font-size="10" fill="#22c55e" text-anchor="end">已掌握</text></g>

