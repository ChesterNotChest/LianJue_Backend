    <rect x="0" y="100" width="248" height="42" rx="8" fill="#f8fafc"/><text x="14" y="127" font-size="12" fill="#64748b">30 天活跃天数</text><text x="220" y="127" font-size="15" font-weight="800" fill="#0f172a" text-anchor="end">18 天</text>
