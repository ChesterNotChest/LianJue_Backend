    <text x="0" y="0" font-size="18" font-weight="700" fill="#0f172a">教学大纲</text>
    <text x="0" y="20" font-size="12" fill="#94a3b8">大数据概论 · 18 周 · 2025-09-01 开学</text>

    <g transform="translate(0,44)"><rect x="0" y="0" width="840" height="48" rx="10" fill="#fff" stroke="#f1f5f9" filter="url(#ss)"/>
      <g transform="translate(20,10)"><text x="0" y="9" font-size="9" fill="#94a3b8">完成</text><text x="0" y="26" font-size="16" font-weight="800" fill="#22c55e">2/18 周</text></g>
      <line x1="110" y1="8" x2="110" y2="40" stroke="#f1f5f9"/>
