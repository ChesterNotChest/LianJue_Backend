      <circle cx="14" cy="16" r="6" fill="#6366f1"/><circle cx="12" cy="13" r="1.2" fill="#fff" opacity="0.8"/><circle cx="16" cy="13" r="1.2" fill="#fff" opacity="0.8"/>
      <text x="26" y="18" font-size="10" fill="#0f172a">这篇挺短的，先扫一眼就行~</text>
