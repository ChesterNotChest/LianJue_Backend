    <text x="626" y="18" font-size="12" fill="rgba(255,255,255,0.95)">RowKey 如何避免热点问题？</text>
    <text x="626" y="30" font-size="9" fill="rgba(255,255,255,0.5)">刚刚</text></g>

    <!-- Agent reply -->
    <g transform="translate(0,134)"><circle cx="14" cy="14" r="13" fill="#6366f1" opacity="0.12"/><text x="14" y="18" font-size="12" fill="#6366f1" text-anchor="middle">AI</text>
    <g transform="translate(36,4)"><rect x="0" y="0" width="780" height="86" rx="12" fill="#fff" stroke="#f1f5f9" filter="url(#ss)"/>
    <rect x="10" y="10" width="760" height="18" rx="4" fill="#f8fafc"/><text x="18" y="23" font-size="8" fill="#64748b">retrieve_learning_evidence · answer_learning_question</text>
    <text x="16" y="52" font-size="13" fill="#0f172a" font-weight="600">三大策略：加盐前缀、散列前缀、反转时间戳。</text>
    <text x="16" y="70" font-size="12" fill="#64748b">加盐前缀最常用，通过添加随机字符均匀分布。</text></g></g>

