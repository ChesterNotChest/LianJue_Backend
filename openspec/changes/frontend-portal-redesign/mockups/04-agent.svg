        <line x1="52" y1="37" x2="98" y2="37" stroke="#22c55e" stroke-width="2"/>
        <circle cx="110" cy="37" r="12" fill="#22c55e" opacity="0.12" stroke="#22c55e"/><text x="110" y="34" font-size="7" fill="#22c55e" text-anchor="middle">MR ✓</text>
        <line x1="122" y1="37" x2="168" y2="37" stroke="#6366f1" stroke-width="2"/>
        <circle cx="180" cy="37" r="14" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="2.5"/><text x="180" y="34" font-size="7" font-weight="700" fill="#6366f1" text-anchor="middle">RowKey</text>
        <line x1="194" y1="37" x2="240" y2="37" stroke="#e2e8f0" stroke-width="1.5"/>
        <circle cx="252" cy="37" r="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="252" y="34" font-size="7" fill="#94a3b8" text-anchor="middle">Spark</text>
