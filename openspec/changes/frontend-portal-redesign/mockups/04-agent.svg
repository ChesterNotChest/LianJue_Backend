      <text x="0" y="44" font-size="9" fill="#64748b">解题速度</text><rect x="0" y="48" width="150" height="4" rx="2" fill="#f1f5f9"/><rect x="0" y="48" width="75" height="4" rx="2" fill="#f59e0b"/><text x="80" y="53" font-size="8" fill="#f59e0b">50%</text>
