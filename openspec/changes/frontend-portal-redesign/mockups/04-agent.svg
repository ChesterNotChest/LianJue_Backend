    <text x="16" y="22" font-size="13" fill="#0f172a" font-weight="600">同学你好，今天我们学习 HBase RowKey 设计。</text>
    <text x="16" y="42" font-size="12" fill="#64748b">你已掌握 HDFS 基础，可以深入 HBase 核心。</text></g>

    <!-- User msg -->
