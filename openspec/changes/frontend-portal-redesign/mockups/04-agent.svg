      <rect x="180" y="0" width="136" height="32" rx="8" fill="#6366f1" opacity="0.1"/>
      <text x="192" y="14" font-size="10" fill="#0f172a">能帮我看看 RowKey</text>
      <text x="192" y="28" font-size="10" fill="#0f172a">热点那部分吗？</text>
