  <text x="40" y="422" font-size="12" fill="#475569">我的测验</text>

  <!-- ═══════ Galaxy embedded in page (deep space sub-window) ═══════ -->
  <g transform="translate(248,72)">
    <!-- Dark frame border -->
    <rect x="0" y="0" width="1176" height="804" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="1176" height="804" rx="14" fill="url(#spaceBg)"/>

    <!-- Starfield -->
    <g opacity="0.3"><circle cx="80" cy="60" r="1" fill="#f8d89c"/><circle cx="300" cy="120" r="0.6" fill="#b8d9ff"/><circle cx="500" cy="50" r="0.9" fill="#8ba4d6"/><circle cx="700" cy="180" r="0.5" fill="#f8d89c"/><circle cx="900" cy="80" r="0.8" fill="#b8d9ff"/><circle cx="1080" cy="200" r="0.5" fill="#8ba4d6"/><circle cx="160" cy="320" r="1" fill="#f8d89c"/><circle cx="440" cy="380" r="0.6" fill="#b8d9ff"/><circle cx="680" cy="600" r="0.5" fill="#b8d9ff"/><circle cx="1000" cy="580" r="0.5" fill="#f8d89c"/></g>

