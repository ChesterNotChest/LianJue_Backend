  <!-- Buddy FAB -->
  <g transform="translate(1364,810)">
    <circle cx="0" cy="0" r="30" fill="#fff" filter="url(#ss)"/><circle cx="0" cy="0" r="28" fill="#6366f1"/>
    <circle cx="-6" cy="-3" r="3.5" fill="#fff" opacity="0.9"/><circle cx="6" cy="-3" r="3.5" fill="#fff" opacity="0.9"/>
    <path d="M-8,8 Q0,18 8,8" stroke="#fff" fill="none" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <circle cx="20" cy="-20" r="10" fill="#ef4444"/><text x="20" y="-16" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">1</text>
