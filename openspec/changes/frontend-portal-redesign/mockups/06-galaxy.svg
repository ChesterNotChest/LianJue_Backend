      <rect x="58" y="0" width="48" height="22" rx="11" fill="rgba(255,255,255,0.03)"/><text x="82" y="15" font-size="9" fill="#475569" text-anchor="middle">平面</text>
    </g>

    <!-- Data source badge -->
    <g transform="translate(12,16)"><rect x="0" y="0" width="240" height="18" rx="4" fill="rgba(0,0,0,0.3)"/><text x="120" y="13" font-size="7" fill="#475569" text-anchor="middle">data: knowledge-graph/snapshot · NebulaOverlay 匹配高亮</text></g>

    <!-- Detail panel (inside dark area, right edge) -->
    <g transform="translate(920,72)">
      <rect x="0" y="0" width="240" height="320" rx="12" fill="rgba(10,16,30,0.92)" stroke="rgba(56,189,248,0.08)"/>
      <rect x="216" y="8" width="16" height="16" rx="8" fill="rgba(255,255,255,0.06)"/><text x="224" y="20" font-size="10" fill="#64748b" text-anchor="middle">x</text>
      <text x="14" y="28" font-size="8" font-weight="700" fill="#7dd3fc" letter-spacing="1">DOC</text>
      <text x="14" y="48" font-size="14" font-weight="800" fill="#f8fafc">HBase RowKey</text>
      <text x="14" y="62" font-size="10" fill="#b6c3d8">HBase 最核心的设计</text>
      <rect x="14" y="78" width="212" height="28" rx="6" fill="rgba(14,165,233,0.12)"/><text x="22" y="96" font-size="9" fill="#d7f1ff">RAG / Doc / 12 links</text>
      <line x1="14" y1="118" x2="226" y2="118" stroke="rgba(255,255,255,0.04)"/>
      <text x="14" y="136" font-size="9" fill="#64748b">ID</text><text x="70" y="136" font-size="9" fill="#94a3b8">doc_hbase_rk</text>
      <text x="14" y="152" font-size="9" fill="#64748b">Score</text><text x="70" y="152" font-size="9" fill="#94a3b8">85%</text>
      <text x="14" y="168" font-size="9" fill="#64748b">Nbrs</text><text x="70" y="168" font-size="9" fill="#94a3b8">12</text>
      <line x1="14" y1="182" x2="226" y2="182" stroke="rgba(255,255,255,0.04)"/>
      <text x="14" y="198" font-size="10" font-weight="700" fill="#dbe7f6">相关段落</text>
      <text x="14" y="216" font-size="9" font-weight="600" fill="#edf6ff">RowKey 设计原则</text>
      <text x="14" y="230" font-size="8" fill="#9fb0c7">散列前缀将头几位替换为哈希值。</text>
    </g>

    <!-- Legend -->
    <g transform="translate(16,766)"><rect x="0" y="0" width="260" height="22" rx="5" fill="rgba(0,0,0,0.4)"/>
      <circle cx="10" cy="11" r="4" fill="#22c55e" opacity="0.7"/><text x="18" y="15" font-size="8" fill="#64748b">已掌握</text>
      <circle cx="72" cy="11" r="4" fill="#6366f1" opacity="0.55"/><text x="80" y="15" font-size="8" fill="#64748b">学习中</text>
      <circle cx="134" cy="11" r="4" fill="#ef4444" opacity="0.5"/><text x="142" y="15" font-size="8" fill="#64748b">薄弱</text>
      <circle cx="186" cy="11" r="4" fill="#fbbf24" opacity="0.6"/><text x="194" y="15" font-size="8" fill="#64748b">当前</text>
