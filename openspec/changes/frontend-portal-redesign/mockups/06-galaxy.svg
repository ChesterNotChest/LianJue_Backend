  <text x="20" y="88" font-size="15" font-weight="700" fill="#0f172a">大数据概论</text>
  <rect x="20" y="98" width="52" height="20" rx="5" fill="#ede9fe"/><text x="46" y="112" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">已发布</text>
  <text x="40" y="150" font-size="13" fill="#475569">学科首页</text>
  <text x="40" y="188" font-size="13" fill="#475569">教学大纲</text>
  <text x="40" y="226" font-size="13" fill="#475569">智能体</text>
  <text x="40" y="264" font-size="13" fill="#475569">学习成长图谱</text>
  <rect x="12" y="282" width="208" height="38" rx="8" fill="#6366f1" opacity="0.1"/><rect x="12" y="282" width="3" height="38" rx="1.5" fill="#6366f1"/>
  <text x="40" y="306" font-size="13" font-weight="700" fill="#6366f1">知识图谱</text>
  <line x1="20" y1="340" x2="212" y2="340" stroke="#f1f5f9"/>
  <text x="20" y="366" font-size="11" fill="#94a3b8" font-weight="600">快捷入口</text>
