  <g transform="translate(1288,794)"><text x="0" y="0" font-size="11" fill="#6366f1" text-anchor="end">学伴小觉</text><text x="0" y="15" font-size="10" fill="#94a3b8" text-anchor="end">全天候陪伴</text></g>
