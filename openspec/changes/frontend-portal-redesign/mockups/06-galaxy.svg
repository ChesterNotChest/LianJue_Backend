      <circle cx="1120" cy="280" r="14" fill="#a78bfa" opacity="0.3"/><text x="1120" y="296" fill="#a78bfa" font-size="10">RAG</text>
      <circle cx="500" cy="240" r="14" fill="#38bdf8" opacity="0.3"/><text x="500" y="256" fill="#38bdf8" font-size="10">Algorithm</text>
      <circle cx="700" cy="560" r="14" fill="#22c55e" opacity="0.3"/><text x="700" y="576" fill="#22c55e" font-size="10">Software</text>
      <circle cx="380" cy="420" r="8" fill="#fbbf24" opacity="0.4"/><text x="380" y="438" fill="#fbbf24" font-size="9">大数据概论</text>
    </g>

    <!-- NebulaOverlay stardust (preserved) -->
    <g opacity="0.6">
      <circle cx="300" cy="180" r="5" fill="#22c55e" opacity="0.7" filter="url(#glow)"/><line x1="300" y1="185" x2="300" y2="208" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
      <circle cx="460" cy="280" r="5" fill="#22c55e" opacity="0.7" filter="url(#glow)"/><line x1="460" y1="285" x2="460" y2="308" stroke="#22c55e" stroke-width="0.5" opacity="0.3"/>
      <circle cx="620" cy="180" r="5" fill="#6366f1" opacity="0.7" filter="url(#glow)"/>
      <circle cx="520" cy="480" r="5" fill="#ef4444" opacity="0.5"/><line x1="520" y1="485" x2="520" y2="508" stroke="#ef4444" stroke-width="0.5" opacity="0.3"/>
      <circle cx="720" cy="320" r="5" fill="#ef4444" opacity="0.5"/>
    </g>

