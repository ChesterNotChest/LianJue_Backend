<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" font-family="Inter, 'Noto Sans SC', system-ui, sans-serif">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Page context (dimmed behind modal) -->
  <rect width="1440" height="960" fill="#f8fafc"/>
  <rect x="0" y="0" width="1440" height="56" fill="#fff" stroke="#f1f5f9"/>
  <text x="32" y="36" font-size="16" font-weight="800" fill="#6366f1" letter-spacing="1">联觉 LianJue</text>
  <!-- Chat area hint -->
  <g opacity="0.08">
    <rect x="264" y="140" width="816" height="340" rx="14" fill="#6366f1"/>
    <text x="672" y="320" font-size="16" fill="#6366f1" text-anchor="middle">Agent 对话区域</text>
  </g>

  <!-- Modal backdrop -->
  <rect x="0" y="0" width="1440" height="960" fill="#0f172a" opacity="0.6"/>
  <!-- Blur hint — subtle overlay -->
  <rect x="0" y="0" width="1440" height="960" fill="#0f172a" opacity="0.05" filter="url(#blur)"/>

  <!-- ═══════ GraphModal container ═══════ -->
  <g transform="translate(58,58)">
    <rect x="0" y="0" width="1324" height="844" rx="18" fill="#fff" opacity="0.95" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Particle dots (simulated ParticleBackground) -->
    <g opacity="0.06">
      <circle cx="120" cy="80" r="1.5" fill="#6366f1"/><circle cx="340" cy="200" r="1" fill="#6366f1"/>
      <circle cx="560" cy="120" r="1.5" fill="#6366f1"/><circle cx="820" cy="300" r="1" fill="#6366f1"/>
      <circle cx="1020" cy="150" r="1" fill="#6366f1"/><circle cx="1150" cy="400" r="1.5" fill="#6366f1"/>
      <circle cx="200" cy="500" r="1" fill="#6366f1"/><circle cx="680" cy="600" r="1.5" fill="#6366f1"/>
      <circle cx="900" cy="700" r="1" fill="#6366f1"/><circle cx="1100" cy="550" r="1" fill="#6366f1"/>
    </g>

    <!-- Title bar -->
    <rect x="0" y="0" width="1324" height="52" rx="18" fill="#fafafa"/><rect x="0" y="26" width="1324" height="26" fill="#fafafa"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#0f172a">推荐路径网络 · 全屏图谱</text>
    <text x="220" y="32" font-size="10" fill="#94a3b8">12 节点 · 18 边 · 滚轮缩放 · 拖拽移动 · G 键切换 · Esc 关闭</text>
    <!-- Reset + Close buttons -->
    <g transform="translate(1228,14)">
      <rect x="0" y="0" width="36" height="24" rx="6" fill="#f1f5f9"/>
      <text x="18" y="16" font-size="9" fill="#64748b" text-anchor="middle">↻</text>
    </g>
    <g transform="translate(1270,14)">
      <rect x="0" y="0" width="36" height="24" rx="6" fill="#f1f5f9"/>
      <text x="18" y="16" font-size="10" fill="#64748b" text-anchor="middle">✕</text>
    </g>

    <!-- ═══ D3 Graph area ═══ -->
    <g transform="translate(20,72)">
      <rect x="0" y="0" width="1284" height="690" rx="12" fill="#fafafa" stroke="#f1f5f9"/>

      <!-- === Main recommendation path (horizontal, bold) === -->
      <!-- HDFS (mastered) -->
      <circle cx="80" cy="200" r="24" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="2.5"/>
      <circle cx="80" cy="200" r="20" fill="none" stroke="#22c55e" opacity="0.08" filter="url(#glow)"/>
      <text x="80" y="190" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">HDFS</text>
      <text x="80" y="205" font-size="7" fill="#22c55e" text-anchor="middle">✓ 已掌握</text>
      <text x="80" y="215" font-size="6" fill="#94a3b8" text-anchor="middle">~2h</text>

      <!-- Edge HDFS → MR -->
      <line x1="104" y1="200" x2="196" y2="200" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
      <polygon points="192,194 202,200 192,206" fill="#22c55e"/>

      <!-- MapReduce (mastered) -->
      <circle cx="240" cy="200" r="22" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="2"/>
      <text x="240" y="190" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">MapReduce</text>
      <text x="240" y="205" font-size="7" fill="#22c55e" text-anchor="middle">✓ 已掌握</text>
      <text x="240" y="215" font-size="6" fill="#94a3b8" text-anchor="middle">~1.5h</text>

      <!-- Edge MR → RowKey -->
      <line x1="262" y1="200" x2="354" y2="200" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
      <polygon points="350,194 360,200 350,206" fill="#6366f1"/>

      <!-- RowKey (active) -->
      <circle cx="400" cy="200" r="28" fill="#6366f1" opacity="0.12" stroke="#6366f1" stroke-width="3" filter="url(#glow)"/>
      <circle cx="400" cy="200" r="24" fill="none" stroke="#6366f1" opacity="0.06" filter="url(#glow)"/>
      <text x="400" y="188" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">RowKey 设计</text>
      <text x="400" y="203" font-size="7" fill="#6366f1" text-anchor="middle">当前步骤</text>
      <text x="400" y="215" font-size="6" fill="#94a3b8" text-anchor="middle">~2h · 难度 ★★★</text>

      <!-- Edge RowKey → Spark -->
      <line x1="428" y1="200" x2="520" y2="200" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,3" stroke-linecap="round"/>
      <polygon points="516,194 526,200 516,206" fill="#cbd5e1"/>

      <!-- Spark (pending) -->
      <circle cx="560" cy="200" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <text x="560" y="190" font-size="9" fill="#94a3b8" text-anchor="middle">Spark 核心</text>
      <text x="560" y="205" font-size="7" fill="#94a3b8" text-anchor="middle">待学习</text>

      <!-- Edge Spark → ML -->
      <line x1="580" y1="200" x2="672" y2="200" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,3"/>
      <polygon points="668,194 678,200 668,206" fill="#e2e8f0"/>

      <!-- ML (pending) -->
      <circle cx="710" cy="200" r="18" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="710" y="190" font-size="9" fill="#cbd5e1" text-anchor="middle">ML 实战</text>
      <text x="710" y="205" font-size="7" fill="#cbd5e1" text-anchor="middle">目标</text>

      <!-- === Candidate branches === -->
      <!-- Branch B: NoSQL path — diverges from RowKey -->
      <line x1="410" y1="220" x2="410" y2="340" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
      <circle cx="330" cy="370" r="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="330" y="365" font-size="8" fill="#94a3b8" text-anchor="middle">NoSQL</text>
      <text x="330" y="377" font-size="6" fill="#94a3b8" text-anchor="middle">路径 B</text>
      <line x1="346" y1="370" x2="406" y2="370" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
      <circle cx="420" cy="370" r="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="420" y="365" font-size="7" fill="#94a3b8" text-anchor="middle">列族</text>
      <line x1="434" y1="370" x2="490" y2="370" stroke="#e2e8f0" stroke-width="0.8" opacity="0.2"/>
      <circle cx="500" cy="370" r="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="500" y="363" font-size="7" fill="#cbd5e1" text-anchor="middle">...</text>

      <line x1="330" y1="370" x2="250" y2="300" stroke="#e2e8f0" stroke-width="0.8" opacity="0.2"/>
      <circle cx="240" cy="295" r="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
      <text x="240" y="289" font-size="7" fill="#cbd5e1" text-anchor="middle">HBase</text>

      <!-- Branch C: alternative from MR -->
      <line x1="250" y1="215" x2="250" y2="480" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
      <circle cx="250" cy="510" r="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="250" y="504" font-size="7" fill="#94a3b8" text-anchor="middle">数据仓库</text>
      <text x="250" y="517" font-size="6" fill="#94a3b8" text-anchor="middle">路径 C</text>
      <line x1="264" y1="510" x2="330" y2="540" stroke="#e2e8f0" stroke-width="0.8" opacity="0.2"/>
      <line x1="264" y1="510" x2="330" y2="480" stroke="#e2e8f0" stroke-width="0.8" opacity="0.2"/>

      <!-- === Prerequisite links (upward) === -->
