      <circle cx="80" cy="120" r="14" fill="#ede9fe" opacity="0.08" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="80" y="117" font-size="7" fill="#a78bfa" text-anchor="middle">ZooKeeper</text>
      <line x1="80" y1="134" x2="80" y2="176" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2,3" opacity="0.25"/>

      <!-- Prerequisite hint: RowKey needs HBase understanding -->
      <circle cx="620" cy="120" r="14" fill="#ede9fe" opacity="0.08" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="620" y="117" font-size="7" fill="#a78bfa" text-anchor="middle">CAP 理论</text>
      <line x1="620" y1="134" x2="580" y2="180" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2,3" opacity="0.25"/>

      <!-- === Path highlight ring on main chain === -->
      <rect x="38" y="35" width="712" height="205" rx="14" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="8,4" opacity="0.12"/>

      <!-- === Hover tooltip on RowKey === -->
      <g transform="translate(380,130)">
        <rect x="0" y="0" width="180" height="52" rx="8" fill="#1e293b" opacity="0.9"/>
        <text x="10" y="16" font-size="9" font-weight="600" fill="#f8fafc">RowKey 设计</text>
        <text x="10" y="30" font-size="8" fill="#94a3b8">HBase RowKey 三大策略</text>
        <text x="10" y="44" font-size="8" fill="#6366f1">下一: Spark 核心 ← 前驱: MapReduce</text>
      </g>
    </g>

    <!-- ═══ CandidatePathSelector overlay (right side of graph) ═══ -->
    <g transform="translate(960,20)">
      <rect x="0" y="0" width="300" height="420" rx="12" fill="#fff" opacity="0.95" stroke="#e2e8f0" filter="url(#glow)"/>
      <!-- Header -->
