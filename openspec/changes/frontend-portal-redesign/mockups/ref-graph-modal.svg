      <text x="14" y="24" font-size="11" font-weight="700" fill="#0f172a">候选学习路径</text>
      <text x="210" y="24" font-size="9" fill="#94a3b8">3 条</text>

      <!-- ═══ Path 1 (active, selected) ═══ -->
      <g transform="translate(8,44)">
        <rect x="0" y="0" width="284" height="116" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="1.5"/>
        <!-- Rank + badge -->
        <text x="12" y="18" font-size="11" font-weight="700" fill="#6366f1">路径 1</text>
        <rect x="56" y="8" width="36" height="14" rx="4" fill="#6366f1" opacity="0.15"/>
        <text x="74" y="18" font-size="8" font-weight="600" fill="#6366f1" text-anchor="middle">推荐</text>
        <text x="260" y="18" font-size="9" fill="#64748b" text-anchor="end">4步 · 8.5h</text>
        <!-- Node chain -->
        <g transform="translate(12,32)">
          <rect x="0" y="0" width="76" height="20" rx="5" fill="#6366f1" opacity="0.12"/><text x="38" y="14" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">HDFS 基础</text>
          <text x="82" y="14" font-size="8" fill="#94a3b8">→</text>
          <rect x="92" y="0" width="68" height="20" rx="5" fill="#6366f1" opacity="0.12"/><text x="126" y="14" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">RowKey</text>
          <text x="166" y="14" font-size="8" fill="#94a3b8">→</text>
          <rect x="176" y="0" width="58" height="20" rx="5" fill="#6366f1" opacity="0.12"/><text x="205" y="14" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">Spark</text>
          <text x="240" y="14" font-size="8" fill="#94a3b8">→</text>
          <rect x="250" y="0" width="26" height="20" rx="5" fill="#f1f5f9"/><text x="263" y="14" font-size="8" fill="#94a3b8" text-anchor="middle">ML</text>
        </g>
        <!-- Context (already mastered) -->
        <g transform="translate(12,64)">
          <text x="0" y="0" font-size="8" fill="#94a3b8">前置已掌握: MapReduce ✓</text>
        </g>
        <!-- Skills -->
        <g transform="translate(12,80)">
          <rect x="0" y="0" width="62" height="16" rx="4" fill="#dcfce7" stroke="#bbf7d0"/><text x="31" y="12" font-size="8" fill="#16a34a" text-anchor="middle">+分布式存储</text>
          <rect x="68" y="0" width="62" height="16" rx="4" fill="#dcfce7" stroke="#bbf7d0"/><text x="99" y="12" font-size="8" fill="#16a34a" text-anchor="middle">+大数据基础</text>
        </g>
      </g>

      <!-- ═══ Path 2 ═══ -->
      <g transform="translate(8,168)">
        <rect x="0" y="0" width="284" height="104" rx="10" fill="#fff" stroke="#e2e8f0"/>
        <text x="12" y="18" font-size="11" font-weight="700" fill="#0f172a">路径 2</text>
        <text x="260" y="18" font-size="9" fill="#64748b" text-anchor="end">5步 · 12h</text>
        <g transform="translate(12,30)">
          <rect x="0" y="0" width="58" height="18" rx="5" fill="#f1f5f9"/><text x="29" y="13" font-size="8" fill="#64748b" text-anchor="middle">NoSQL</text>
          <text x="62" y="13" font-size="8" fill="#cbd5e1">→</text>
          <rect x="70" y="0" width="42" height="18" rx="5" fill="#f1f5f9"/><text x="91" y="13" font-size="8" fill="#64748b" text-anchor="middle">列族</text>
          <text x="116" y="13" font-size="8" fill="#cbd5e1">→</text>
          <rect x="124" y="0" width="68" height="18" rx="5" fill="#f1f5f9"/><text x="158" y="13" font-size="8" fill="#64748b" text-anchor="middle">RowKey</text>
          <text x="196" y="13" font-size="8" fill="#cbd5e1">→</text>
          <rect x="204" y="0" width="58" height="18" rx="5" fill="#f1f5f9"/><text x="233" y="13" font-size="8" fill="#64748b" text-anchor="middle">Spark</text>
          <text x="266" y="13" font-size="8" fill="#cbd5e1">→</text>
          <rect x="274" y="0" width="26" height="18" rx="5" fill="#f1f5f9"/><text x="287" y="13" font-size="7" fill="#94a3b8" text-anchor="middle">ML</text>
        </g>
        <g transform="translate(12,60)">
          <rect x="0" y="0" width="56" height="16" rx="4" fill="#dcfce7" stroke="#bbf7d0"/><text x="28" y="12" font-size="7" fill="#16a34a" text-anchor="middle">+NoSQL</text>
          <rect x="60" y="0" width="56" height="16" rx="4" fill="#dcfce7" stroke="#bbf7d0"/><text x="88" y="12" font-size="7" fill="#16a34a" text-anchor="middle">+列族存储</text>
        </g>
      </g>

      <!-- ═══ Path 3 ═══ -->
      <g transform="translate(8,280)">
        <rect x="0" y="0" width="284" height="104" rx="10" fill="#fff" stroke="#e2e8f0"/>
        <text x="12" y="18" font-size="11" font-weight="700" fill="#0f172a">路径 3</text>
        <text x="260" y="18" font-size="9" fill="#64748b" text-anchor="end">6步 · 15h</text>
        <g transform="translate(12,30)">
          <rect x="0" y="0" width="42" height="18" rx="5" fill="#f1f5f9"/><text x="21" y="13" font-size="8" fill="#64748b" text-anchor="middle">CAP</text>
          <text x="46" y="13" font-size="8" fill="#cbd5e1">→</text>
          <rect x="54" y="0" width="52" height="18" rx="5" fill="#f1f5f9"/><text x="80" y="13" font-size="8" fill="#64748b" text-anchor="middle">HBase</text>
          <text x="110" y="13" font-size="8" fill="#cbd5e1">→</text>
          <rect x="118" y="0" width="68" height="18" rx="5" fill="#f1f5f9"/><text x="152" y="13" font-size="8" fill="#64748b" text-anchor="middle">RowKey</text>
          <text x="190" y="13" font-size="8" fill="#cbd5e1">→</text>
          <rect x="198" y="0" width="58" height="18" rx="5" fill="#f1f5f9"/><text x="227" y="13" font-size="8" fill="#64748b" text-anchor="middle">Spark</text>
        </g>
        <g transform="translate(12,60)">
          <rect x="0" y="0" width="56" height="16" rx="4" fill="#dcfce7" stroke="#bbf7d0"/><text x="28" y="12" font-size="7" fill="#16a34a" text-anchor="middle">+分布式</text>
          <rect x="60" y="0" width="56" height="16" rx="4" fill="#dcfce7" stroke="#bbf7d0"/><text x="88" y="12" font-size="7" fill="#16a34a" text-anchor="middle">+HBase</text>
        </g>
