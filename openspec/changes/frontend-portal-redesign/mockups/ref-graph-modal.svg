    <!-- Legend -->
    <g transform="translate(38,786)">
      <g transform="translate(0,0)">
        <circle cx="5" cy="5" r="5" fill="#22c55e" opacity="0.15" stroke="#22c55e"/><text x="15" y="9" font-size="9" fill="#64748b">已掌握</text>
      </g>
      <g transform="translate(90,0)">
        <circle cx="5" cy="5" r="5" fill="#6366f1" opacity="0.12" stroke="#6366f1"/><text x="15" y="9" font-size="9" fill="#64748b">当前/学习中</text>
      </g>
      <g transform="translate(200,0)">
        <circle cx="5" cy="5" r="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="15" y="9" font-size="9" fill="#64748b">待学习</text>
      </g>
      <g transform="translate(280,0)">
        <circle cx="5" cy="5" r="5" fill="#ede9fe" opacity="0.08" stroke="#a78bfa" stroke-dasharray="3,3"/><text x="15" y="9" font-size="9" fill="#64748b">先修依赖</text>
      </g>
      <!-- Layout indicator -->
      <g transform="translate(380,0)">
        <text x="0" y="9" font-size="9" fill="#94a3b8">布局: dagre · 高亮路径: HDFS → RowKey</text>
      </g>
    </g>

    <!-- Keyboard hint -->
    <g transform="translate(38,814)">
      <rect x="0" y="0" width="20" height="18" rx="4" fill="#f1f5f9"/><text x="10" y="13" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">G</text>
      <text x="26" y="13" font-size="9" fill="#94a3b8">切换布局</text>
      <rect x="110" y="0" width="32" height="18" rx="4" fill="#f1f5f9"/><text x="126" y="13" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">Esc</text>
      <text x="148" y="13" font-size="9" fill="#94a3b8">关闭</text>
    </g>
